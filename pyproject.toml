[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loop-engineering-example"
version = "0.0.0"
description = "A forkable demo that turns monitoring events into pull requests"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Florian Gutendorf Heiwig" },
]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
